# openspec/config.yaml
schema: spec-driven

context: |
  Tech stack: none yet — fresh project, URL shortener from scratch
  Architecture: TBD
  Testing: TBD (no test runner available yet)
  Style: TBD
  Language: TBD (likely Go or Node.js)

rules:
  proposal:
    - Include rollback plan for risky changes
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    - Follow existing code patterns
    tdd: false
    test_command: ''
  verify:
    test_command: ''
    build_command: ''
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas

testing:
  strict_tdd: false
  test_runner: null
  test_layers:
    unit: false
    integration: false
    e2e: false
  coverage: false
  linter: null
  type_checker: null
  formatter: null
  note: No test runner detected — project has no code yet. strict_tdd set to false.
